<!doctype html><html lang="en"><meta charset="utf-8"><title>CareerCraft sandbox test portal</title>
<style>body{font:18px system-ui;max-width:700px;margin:50px auto;padding:20px}label{display:block;margin:20px 0}input,textarea{display:block;padding:10px;width:90%;font:inherit}button{padding:12px;font:inherit}</style>
<h1>Test employer: Python Engineer</h1><p>This local fixture never sends a real application.</p>
<form id="application"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Resume<input name="resume" type="file" onchange="document.querySelector('#upload-status').textContent=this.files[0]?.name || ''"></label><p id="upload-status" role="status"></p><label>Cover letter<textarea name="letter" required oninput="document.querySelector('#keyboard-status').textContent=this.value"></textarea></label><p id="keyboard-status" role="status"></p><button>Submit test application</button></form>
<p id="receipt" role="status"></p><script>if(localStorage.getItem('testApplications'))document.querySelector('#receipt').textContent='Previously submitted test applications: '+localStorage.getItem('testApplications');document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('testApplications',String(Number(localStorage.getItem('testApplications')||0)+1));document.querySelector('#receipt').textContent='Test application received. Count: '+localStorage.getItem('testApplications');});</script></html>
