; Process table for the single-container build.
;
; priority orders startup: Redis must be listening before the backend and the
; BullMQ worker connect, and nginx is last so it resolves upstreams that are
; already bound. supervisord has no real dependency graph, so each dependent
; process also retries -- startretries covers the gap while Redis warms up.
;
; All logs go to stdout/stderr so `docker logs` shows every service in one
; stream; program_name is prefixed so you can tell them apart.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
priority=10
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_events_enabled=true

[program:backend]
priority=20
directory=/app
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent-worker]
priority=30
directory=/app
command=python -m app.workflow_worker
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:temporal-worker]
priority=30
directory=/app
command=/bin/sh -ec 'if [ "${TEMPORAL_ENABLED:-false}" = "true" ]; then exec python -m app.temporal_worker; fi; exec tail -f /dev/null'
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
priority=30
directory=/srv/worker
command=node dist/index.js
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:frontend]
priority=40
directory=/srv/frontend
command=node server.js
environment=PORT="3000",HOSTNAME="127.0.0.1"
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
priority=50
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
