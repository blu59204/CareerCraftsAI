name: careercraft-isolated
services:
  backend:
    build: ../../backend
    network_mode: host
    env_file: /opt/careercraft-secrets/backend.env
    command: uvicorn app.main:app --host 127.0.0.1 --port 18100
    init: true
    mem_limit: 1500m
    cpus: 0.5
    restart: unless-stopped
  agent-worker:
    build: ../../backend
    network_mode: host
    env_file: /opt/careercraft-secrets/backend.env
    command: python -m app.workflow_worker
    init: true
    mem_limit: 2g
    cpus: 0.75
    stop_grace_period: 360s
    restart: unless-stopped
  scheduler:
    build: ../../worker
    network_mode: host
    env_file: /opt/careercraft-secrets/backend.env
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        BACKEND_URL: http://127.0.0.1:18100
    network_mode: host
    environment:
      PORT: 18101
      HOSTNAME: 127.0.0.1
      BACKEND_URL: http://127.0.0.1:18100
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    mem_limit: 768m
    cpus: 0.5
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    network_mode: host
    command: redis-server /etc/redis/careercraft.conf
    volumes:
      - /opt/careercraft-secrets/redis.conf:/etc/redis/careercraft.conf:ro
      - redis_data:/data
    mem_limit: 384m
    restart: unless-stopped
  gateway:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 128m
    restart: unless-stopped
  sandbox-server:
    build:
      context: .
      dockerfile: OpenSandbox.Dockerfile
    network_mode: host
    env_file: /opt/careercraft-secrets/sandbox.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandbox.toml:/etc/opensandbox.toml:ro
      - sandbox_metadata:/root/.opensandbox
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox.toml
    mem_limit: 512m
    cpus: 0.25
    restart: unless-stopped
volumes:
  redis_data:
  sandbox_metadata:
