[server]
host = "127.0.0.1"
port = 18190
max_sandbox_timeout_seconds = 3600

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.6"

[docker]
network_mode = "bridge"
host_ip = "127.0.0.1"
no_new_privileges = true
pids_limit = 256
port_range_min = 41000
port_range_max = 41200

[egress]
image = "opensandbox/egress:v1.1.7"
mode = "dns+nft"
disable_ipv6 = true

[storage]
allowed_host_paths = []
