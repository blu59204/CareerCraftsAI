# Self-hosted Temporal (server + its own Postgres + Web UI). Runs on the APP
# VM next to compose.yml, and nothing here leaves loopback: the server binds
# 127.0.0.1:7233, its Postgres 127.0.0.1:19232, the UI 127.0.0.1:19280. The
# backend, temporal-worker and notification-worker (all network_mode: host in
# compose.yml) reach it at TEMPORAL_ADDRESS=127.0.0.1:7233, so no firewall or
# Oracle Security List port is needed for Temporal.
#
# The OSS Web UI has no auth, so it is never published. Reach it through an
# SSH tunnel:  ssh -N -L 19280:127.0.0.1:19280 oraclevm
# then open http://localhost:19280.
#
# Start (from deploy/oracle-vm):
#   docker compose -f temporal-compose.yml up -d
# Temporal images are genuine multi-arch (native arm64), no emulation needed.
#
# Ports: 7233 frontend, 6933-6939 internal cluster membership, 19232 Postgres.
# All are loopback-only because BIND_ON_IP is 127.0.0.1.
name: temporal-isolated
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  temporal-postgres:
    image: postgres:16-alpine
    network_mode: host
    command: postgres -p 19232 -c listen_addresses=127.0.0.1
    env_file: /opt/careercraft-secrets/temporal.env
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    mem_limit: 384m
    cpus: 0.25
    restart: unless-stopped
    logging: *logging
  temporal:
    image: temporalio/auto-setup:1.24
    network_mode: host
    env_file: /opt/careercraft-secrets/temporal.env
    environment:
      DB: postgres12
      DB_PORT: "19232"
      POSTGRES_SEEDS: 127.0.0.1
      # Under network_mode: host, auto-setup's entrypoint otherwise resolves
      # the box's own hostname to bind on -- which on Ubuntu is 127.0.1.1
      # (the /etc/hosts loopback alias). Pin loopback explicitly. The server's
      # config template defaults bindOnIP to 127.0.0.1 as well, and the
      # entrypoint derives the CLI's TEMPORAL_ADDRESS from this value.
      BIND_ON_IP: 127.0.0.1
      # Ringpop advertises this address to cluster members. It only *has* to be
      # set when binding 0.0.0.0, but keeping it identical to the bind address
      # is correct for a single node and exists on the loopback interface.
      TEMPORAL_BROADCAST_ADDRESS: "127.0.0.1"
    depends_on:
      - temporal-postgres
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    logging: *logging
  temporal-ui:
    image: temporalio/ui:2.54.1
    network_mode: host
    environment:
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      TEMPORAL_UI_PORT: "19280"
      TEMPORAL_UI_PUBLIC_PATH: ""
      # Public via host nginx (basic auth + TLS) at temporal.careercraftsai.me.
      TEMPORAL_CORS_ORIGINS: https://temporal.careercraftsai.me
    volumes:
      # Adds `host: 127.0.0.1`; the stock image binds every interface and has
      # no env var to change that. See the header of the file.
      - ./temporal-ui-config.yaml:/home/ui-server/config/docker.yaml:ro
    depends_on:
      - temporal
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    logging: *logging
volumes:
  temporal_pgdata:
