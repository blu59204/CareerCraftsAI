<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Backend Engineer — Acme (fixture)</title></head>
<body>
  <main id="app">
    <h1>Backend Engineer</h1>
    <p>Acme · Bengaluru</p>
    <form id="application" onsubmit="return false">
      <label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text" required>
      <label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text" required>
      <label for="email">Email *</label><input id="email" name="email" type="email" required>
      <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
      <label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin" type="url">
      <label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required>
      <label for="source">How did you hear about us?</label>
      <select id="source" name="source">
        <option value="">Select…</option><option value="li">LinkedIn</option><option value="ref">Referral</option><option value="other">Other</option>
      </select>
      <fieldset>
        <legend>Will you now or in the future require visa sponsorship? *</legend>
        <label><input type="radio" name="sponsorship" value="yes" required> Yes</label>
        <label><input type="radio" name="sponsorship" value="no"> No</label>
      </fieldset>
      <label for="why">Why do you want to work at Acme? *</label><textarea id="why" name="why" required></textarea>
      <label><input type="checkbox" id="consent" name="consent" required> I agree to the privacy policy *</label>
      <button type="submit" id="submit">Submit Application</button>
    </form>
  </main>
  <script>
    window.submits = 0;
    document.getElementById("application").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      if (!form.checkValidity()) { form.reportValidity(); return; }
      window.submits += 1;
      const data = Object.fromEntries(new FormData(form).entries());
      data.resume = form.resume.files[0] ? form.resume.files[0].name : null;
      window.submittedData = data;
      document.getElementById("app").innerHTML = "<h1>Thank you for applying!</h1><p>We have received your application.</p>";
    });
  </script>
</body>
</html>
