name: CI

on:
  push:
    branches: [main, develop, deploy/scalable-sandbox-workflows]
  pull_request:
    branches: [main, develop, deploy/scalable-sandbox-workflows]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -c constraints.txt ruff black bandit

      - name: Lint (ruff)
        run: ruff check . --exit-zero
      - name: Reject new Ruff diagnostics
        run: python ../scripts/check_changed_python_lint.py
        env:
          CI_LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Format check (black)
        run: black --check .

      - name: Security scan (bandit)
        run: bandit -r app/ -ll -x tests/

      - name: Unit tests
        run: pytest tests/unit -v --cov=app --cov-report=term-missing
        env:
          APP_SECRET_KEY: "test-secret-key-32-chars-minimum!!"
          DATABASE_URL: "postgresql+asyncpg://x:x@localhost/x"
          SUPABASE_URL: "https://x.supabase.co"
          SUPABASE_SERVICE_KEY: "x"
          SUPABASE_JWT_SECRET: "test-jwt-secret-not-real"
          REDIS_URL: "redis://localhost:6379"

  backend-unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -c constraints.txt pytest pytest-cov pytest-timeout
      - name: Unit tests
        run: pytest tests/unit -v --cov=app --cov-report=term-missing
        env:
          APP_SECRET_KEY: "test-secret-key-32-chars-minimum!!"
          DATABASE_URL: "postgresql+asyncpg://x:x@localhost/x"
          SUPABASE_URL: "https://x.supabase.co"
          SUPABASE_SERVICE_KEY: "x"
          SUPABASE_JWT_SECRET: "test-jwt-secret-not-real"
          REDIS_URL: "redis://localhost:6379"

  backend-workflow-integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt -c constraints.txt
        working-directory: backend

      - name: Start disposable Postgres/Redis/browser containers
        run: docker compose -p careercraft-workflow-tests -f docker-compose.test.yml up -d postgres redis browser

      - name: Wait for Postgres to be healthy
        run: |
          for i in $(seq 1 30); do
            if docker exec careercraft-workflow-tests-postgres-1 pg_isready -U workflow_test; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Durable workflow integration tests
        working-directory: backend
        run: python -m pytest tests/integration/test_durable_workflows.py -v --timeout=90
        env:
          RUN_WORKFLOW_INTEGRATION: "1"

      - name: Tear down disposable containers
        if: always()
        run: docker compose -p careercraft-workflow-tests -f docker-compose.test.yml down

  frontend-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  worker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run build
