[project]
name = "jobagent-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP", "S"]
ignore = ["S101", "B008"]  # B008: Depends() in FastAPI signatures is correct DI pattern

[tool.ruff.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No unit test may hit network or a browser: fail fast instead of hanging.
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: end-to-end browser tests (requires RUN_E2E=1 and full Docker stack)",
    "api: API-only tests, no browser required",
    "security: security verification tests (JWT, HITL gates, rate limiting)",
    "browser: Playwright browser interaction tests",
    "integration: tests requiring real infrastructure (DB, Redis, LLM)",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
