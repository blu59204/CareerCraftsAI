<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Apply - Acme Corp</title></head>
<body>
<form id="application-form" action="https://boards.greenhouse.io/embed/job_app?for=acme&token=123" method="post">
  <div class="field">
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" required>
  </div>
  <div class="field">
    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div class="field">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">
  </div>
  <div class="field">
    <label for="resume">Resume/CV</label>
    <input type="file" id="resume" name="resume" required>
  </div>
  <div class="field">
    <label for="cover_letter">Cover Letter</label>
    <input type="file" id="cover_letter" name="cover_letter">
  </div>
  <div class="field">
    <label for="how_heard">How did you hear about this job?</label>
    <select id="how_heard" name="how_heard">
      <option value="">Select...</option>
      <option value="linkedin">LinkedIn</option>
      <option value="referral">Referral</option>
      <option value="other">Other</option>
    </select>
  </div>
  <fieldset>
    <legend>Are you legally authorized to work in the United States?</legend>
    <label for="work_auth_yes">Yes</label>
    <input type="radio" id="work_auth_yes" name="work_authorized" value="yes" required>
    <label for="work_auth_no">No</label>
    <input type="radio" id="work_auth_no" name="work_authorized" value="no" required>
  </fieldset>
  <fieldset>
    <legend>Voluntary self-identification</legend>
    <label for="self_id_agree">I agree to the voluntary self-identification terms</label>
    <input type="checkbox" id="self_id_agree" name="self_id_agree" required>
  </fieldset>
  <button type="submit">Submit Application</button>
</form>
</body>
</html>
