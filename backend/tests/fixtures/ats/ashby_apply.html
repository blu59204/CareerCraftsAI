<!--
  Representative fixture only — modeled on Ashby's public application-form
  conventions (labeled inputs, a file upload, a required select, a required
  radio group). Not verified against a real jobs.ashbyhq.com posting; no
  network access was available to confirm exact markup.
-->
<!DOCTYPE html>
<html>
<body>
  <h1>Apply to Acme Corp</h1>
  <form id="application-form">
    <label>Full Name<input name="full_name" id="full_name" type="text" required></label>
    <label>Email<input name="email" id="email" type="email" required></label>
    <label>Phone<input name="phone" id="phone" type="tel"></label>

    <label>Resume/CV<input type="file" id="resume" aria-label="Resume/CV" required></label>
    <label>Cover Letter (optional)<input type="file" id="cover_letter" aria-label="Cover Letter (optional)"></label>

    <label>How did you hear about this role?
      <select name="source" id="source" required>
        <option value="">Select an option</option>
        <option value="linkedin">LinkedIn</option>
        <option value="referral">Referral</option>
        <option value="other">Other</option>
      </select>
    </label>

    <fieldset>
      <legend>Are you legally authorized to work in this country?</legend>
      <label><input type="radio" name="work_authorized" value="yes"> Yes</label>
      <label><input type="radio" name="work_authorized" value="no" required> No</label>
    </fieldset>

    <button type="button" onclick="window.submits=(window.submits||0)+1;document.body.innerHTML='Thank you for applying'">
      Submit Application
    </button>
  </form>
</body>
</html>
