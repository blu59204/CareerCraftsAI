<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Apply - Acme Corp</title></head>
<body>
<div class="application-form">
<form action="https://jobs.lever.co/acme/11111111-2222-3333-4444-555555555555/apply" method="post">
  <label for="name">Full name</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone">

  <label for="org">Current company</label>
  <input type="text" id="org" name="org">

  <label for="urls[LinkedIn]">LinkedIn URL</label>
  <input type="url" id="urls[LinkedIn]" name="urls[LinkedIn]">

  <label for="resume">Resume/CV</label>
  <input type="file" id="resume" name="resume" required>

  <label for="work_auth">Are you authorized to work in this country?</label>
  <select id="work_auth" name="work_auth" required>
    <option value="">Select an option</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <fieldset>
    <legend>Gender</legend>
    <label for="gender_male">Male</label>
    <input type="radio" id="gender_male" name="gender" value="male">
    <label for="gender_female">Female</label>
    <input type="radio" id="gender_female" name="gender" value="female">
    <label for="gender_decline">Decline to self-identify</label>
    <input type="radio" id="gender_decline" name="gender" value="decline">
  </fieldset>

  <fieldset>
    <legend>Data processing consent</legend>
    <label for="consent">I consent to Lever's processing of my data for recruiting purposes</label>
    <input type="checkbox" id="consent" name="consent" required>
  </fieldset>

  <button type="submit">Submit application</button>
</form>
</div>
</body>
</html>
