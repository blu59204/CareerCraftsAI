# Local/single-VM Docker Compose stack: backend API, Temporal worker, Temporal
# server (+ its own Postgres and web UI), Redis, frontend and nginx, sharing
# the default bridge network and Docker-managed named volumes. See
# deploy/oracle/compose.yml for the Oracle Cloud VM variant (network_mode: host,
# self-hosted Postgres).
#
# Every agent run, job search, application and follow-up executes on the
# temporal-worker service — without it, nothing the API starts makes progress
# (GET /health reports "temporal": {"workers": 0} and status "degraded").
services:
  frontend:
    build:
      context: ./frontend
      # Next.js inlines NEXT_PUBLIC_* into the client bundle at BUILD time.
      # env_file only applies at runtime, so without these args the browser
      # ships with an empty Clerk publishable key and auth never initialises.
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        BACKEND_URL: http://backend:8000
    env_file: ./frontend/.env.local
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      # Docker sets HOSTNAME to the container id, and Next.js standalone's
      # server.js reads that same variable to pick its bind address -- so it
      # binds the eth0 IP only. nginx still reaches it, but the healthcheck
      # (which dials 0.0.0.0:3000) gets ECONNREFUSED and the container is
      # marked unhealthy, blocking any depends_on: service_healthy.
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://0.0.0.0:3000',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200&&d.length>100?0:1))}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Containers must use the Temporal service DNS name. Set
      # TEMPORAL_ADDRESS_DOCKER to a Temporal Cloud address when this Compose
      # topology is used with a managed Temporal deployment.
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS_DOCKER:-temporal:7233}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped
    # Browser Use (Chromium/Playwright) resource limits.
    # Each Chromium session uses ~200-500 MB RAM; cap total to prevent OOM.
    # shm_size is required — without it Chromium crashes with SIGBUS on /dev/shm.
    # Tune mem_limit based on VPS RAM: 4 GB VPS → 2.5g, 8 GB VPS → 5g.
    mem_limit: 2500m
    shm_size: "256m"
    volumes:
      - browser_debug:/tmp/browser_debug
      # Uploaded resumes/documents (storage_service.py, DOCUMENT_STORAGE_DIR,
      # default /data/documents). Must be shared with temporal-worker below --
      # without it, a document this container writes is invisible to the
      # activities reading it back (application_workflow.py's load_resume),
      # since each container otherwise gets its own ephemeral filesystem.
      - docstore:/data/documents
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Temporal ────────────────────────────────────────────────────
  # Self-hosted server for local/single-VM use. A production deployment can
  # point TEMPORAL_ADDRESS_DOCKER at Temporal Cloud instead (mTLS settings in
  # backend/.env, see backend/app/core/temporal_client.py) and drop the
  # temporal, temporal-postgres and temporal-ui services — never the worker.
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8233:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  # Executes every workflow and activity and registers the recurring
  # Schedules (daily job search, maintenance). Scale with `--scale`.
  temporal-worker:
    build: ./backend
    command: python -m app.temporal_worker
    env_file: ./backend/.env
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS_DOCKER:-temporal:7233}
    init: true
    # Long enough for an in-flight agent activity to finish on shutdown.
    stop_grace_period: 360s
    mem_limit: 2g
    shm_size: "256m"
    volumes:
      # Shared with backend — see the docstore comment on that service.
      - docstore:/data/documents
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # envsubst substitutes only ${DOMAIN} in the template; nginx runtime
      # variables ($host, $remote_addr, ...) are left untouched by the filter.
      DOMAIN: ${DOMAIN:-localhost}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  # Browser Use debug screenshots — mounted into the backend container at
  # /tmp/browser_debug. Enable with BROWSER_DEBUG_SCREENSHOTS=true in .env.
  # Inspect failures with: docker compose exec backend ls /tmp/browser_debug/
  browser_debug:
  # Uploaded resumes/cover letters (storage_service.py). Shared between
  # backend and temporal-worker so a document either container writes is
  # visible to the other. Matches deploy/oracle/compose.yml's docstore volume.
  docstore:
  # Temporal's own event-history store — separate from the app's Postgres.
  temporal_postgres_data:
