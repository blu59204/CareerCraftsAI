services:
  frontend:
    build: ./frontend
    env_file: ./frontend/.env.local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://0.0.0.0:3000',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200&&d.length>100?0:1))}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Browser Use (Chromium/Playwright) resource limits.
    # Each Chromium session uses ~200-500 MB RAM; cap total to prevent OOM.
    # shm_size is required — without it Chromium crashes with SIGBUS on /dev/shm.
    # Tune mem_limit based on VPS RAM: 4 GB VPS → 2.5g, 8 GB VPS → 5g.
    mem_limit: 2500m
    shm_size: "256m"
    volumes:
      - browser_debug:/tmp/browser_debug
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build: ./worker
    env_file: ./worker/.env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  agent-worker:
    build: ./backend
    command: python -m app.workflow_worker
    env_file: ./backend/.env
    init: true
    stop_grace_period: 360s
    mem_limit: 2g
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # envsubst substitutes only ${DOMAIN} in the template; nginx runtime
      # variables ($host, $remote_addr, ...) are left untouched by the filter.
      DOMAIN: ${DOMAIN:-localhost}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  # Browser Use debug screenshots — mounted into the backend container at
  # /tmp/browser_debug. Enable with BROWSER_DEBUG_SCREENSHOTS=true in .env.
  # Inspect failures with: docker compose exec backend ls /tmp/browser_debug/
  browser_debug:
