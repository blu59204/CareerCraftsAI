# Disposable integration infrastructure. No production credentials or volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflow_test
      POSTGRES_PASSWORD: workflow_test
      POSTGRES_DB: workflow_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:56379:6379"
  browser:
    build: ./sandbox
    image: careercraft-browser:1
    init: true
    shm_size: 256m
    mem_limit: 1g
    ports:
      - "127.0.0.1:59222:9222"
